name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      IDENTIFIER: com.doublearrow.agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64 (Apple Silicon, native)
        run: |
          mkdir -p bin
          swiftc -O Sources/*.swift -o bin/double-arrow-arm64

      - name: Build x86_64 (Intel, cross-compiled)
        run: |
          swiftc -target x86_64-apple-macosx11.0 -O Sources/*.swift -o bin/double-arrow-x64

      - name: Verify architectures
        run: |
          file bin/double-arrow-arm64
          file bin/double-arrow-x64

      - name: Ad-hoc codesign
        run: |
          codesign --force -s - --identifier "$IDENTIFIER" bin/double-arrow-arm64
          codesign --force -s - --identifier "$IDENTIFIER" bin/double-arrow-x64

      - name: Package archives
        run: |
          chmod +x bin/double-arrow-arm64 bin/double-arrow-x64 Scripts/install-agent.sh Scripts/uninstall.sh
          mkdir -p dist

          for arch in arm64 x64; do
            pkg="dist/pkg-$arch"
            mkdir -p "$pkg"
            cp "bin/double-arrow-$arch" "$pkg/double-arrow"
            cp Scripts/install-agent.sh "$pkg/install.sh"
            cp Scripts/uninstall.sh "$pkg/uninstall.sh"
            tar -czf "dist/double-arrow-macos-$arch.tar.gz" -C "$pkg" double-arrow install.sh uninstall.sh
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/double-arrow-macos-arm64.tar.gz \
              dist/double-arrow-macos-x64.tar.gz \
              --clobber
          else
            gh release create "$TAG" \
              --generate-notes \
              dist/double-arrow-macos-arm64.tar.gz \
              dist/double-arrow-macos-x64.tar.gz
          fi
